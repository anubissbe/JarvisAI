version: '3.8'

x-logging: &loki-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &security-defaults
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
  backend:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/24
  ai_network:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.3.0/24
  monitoring:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  opensearch_data:
  minio_data:
  ollama_models:
  grafana_data:
  prometheus_data:
  loki_data:

services:
  # Frontend Service (Open WebUI)
  frontend:
    image: ghcr.io/open-webui/open-webui:main
    container_name: jarvis-frontend
    <<: *security-defaults
    logging: *loki-logging
    ports:
      - "3000:8080"
    networks:
      - frontend
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URL=http://api:8000/v1
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-your-secret-key}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-pending}
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - api
      - ollama
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    restart: unless-stopped

  # API Gateway (FastAPI)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis-api
    <<: *security-defaults
    logging: *loki-logging
    ports:
      - "8000:8000"
    networks:
      - frontend
      - backend
      - ai_network
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-jarvis_password}@postgres:5432/jarvis
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=http://ollama:11434
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minio_user}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minio_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    restart: unless-stopped

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    <<: *security-defaults
    logging: *loki-logging
    ports:
      - "11434:11434"
    networks:
      - ai_network
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - CUDA_VISIBLE_DEVICES=0,1
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_FLASH_ATTENTION=1
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 32G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jarvis-qdrant
    <<: *security-defaults
    logging: *loki-logging
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - ai_network
      - backend
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 16G
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jarvis-postgres
    <<: *security-defaults
    logging: *loki-logging
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-jarvis_password}
      - POSTGRES_DB=jarvis
      - POSTGRES_USER=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    <<: *security-defaults
    logging: *loki-logging
    networks:
      - backend
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: jarvis-minio
    <<: *security-defaults
    logging: *loki-logging
    networks:
      - backend
      - ai_network
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minio_user}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minio_password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped

  # Document Processing Service
  document-processor:
    build:
      context: ./services/document-processor
      dockerfile: Dockerfile
    container_name: jarvis-doc-processor
    <<: *security-defaults
    logging: *loki-logging
    networks:
      - backend
      - ai_network
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minio_user}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minio_password}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - minio
      - redis
      - qdrant
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    restart: unless-stopped

  # Agent Orchestrator
  agent-orchestrator:
    build:
      context: ./services/agent-orchestrator
      dockerfile: Dockerfile
    container_name: jarvis-orchestrator
    <<: *security-defaults
    logging: *loki-logging
    networks:
      - backend
      - ai_network
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - POSTGRES_URL=postgresql://postgres:${DB_PASSWORD:-jarvis_password}@postgres:5432/jarvis
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
    depends_on:
      - postgres
      - redis
      - ollama
      - qdrant
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    restart: unless-stopped

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: jarvis-prometheus
    <<: *security-defaults
    logging: *loki-logging
    networks:
      - monitoring
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: jarvis-grafana
    <<: *security-defaults
    logging: *loki-logging
    networks:
      - monitoring
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  open-webui: