name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: '[FEATURE] '
labels: ['enhancement', 'needs-triage']
assignees: ['anubissbe']

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature! Please provide detailed information to help us understand and prioritize your request.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please check the following before submitting
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have checked the roadmap and this feature isn't already planned
          required: true
        - label: This feature aligns with JarvisAI's goals and scope
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What type of feature is this?
      options:
        - UI/UX Enhancement
        - New AI Capability
        - Performance Improvement
        - Security Enhancement
        - Integration/API
        - Developer Experience
        - Documentation
        - Monitoring/Observability
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical (Blocking core functionality)
        - High (Significantly improves user experience)
        - Medium (Nice to have improvement)
        - Low (Minor enhancement)
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: Brief one-line summary of the feature
      placeholder: A concise description of what you want to add...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: |
        As a [user type], I want [goal] so that [benefit]...
        
        Currently, users face the following problem...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Detailed description of your proposed solution
      placeholder: Describe your solution in detail...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions have you considered?
      placeholder: Describe alternative approaches...

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Specific scenarios where this feature would be used
      placeholder: |
        1. User wants to...
        2. Administrator needs to...
        3. Developer wants to...

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know this feature is complete?
      placeholder: |
        - [ ] Users can...
        - [ ] System should...
        - [ ] Feature includes...

  - type: dropdown
    id: complexity
    attributes:
      label: Implementation Complexity
      description: How complex do you think this feature is?
      options:
        - Simple (1-2 days)
        - Medium (1-2 weeks)
        - Complex (1-2 months)
        - Very Complex (3+ months)
        - Unknown

  - type: textarea
    id: technical-details
    attributes:
      label: Technical Implementation Details
      description: Any technical considerations or implementation ideas
      placeholder: |
        - API changes needed...
        - Database schema changes...
        - Dependencies required...
        - Performance considerations...

  - type: textarea
    id: mockups
    attributes:
      label: Mockups/Wireframes
      description: Visual representation of the feature (if applicable)
      placeholder: Drag and drop images here or describe the UI...

  - type: checkboxes
    id: impact
    attributes:
      label: Impact Assessment
      description: What areas would this feature impact?
      options:
        - label: Breaking changes to existing APIs
        - label: Database migration required
        - label: Performance impact on existing features
        - label: Security implications
        - label: Documentation updates needed
        - label: Testing strategy required

  - type: textarea
    id: resources
    attributes:
      label: Available Resources
      description: Can you help implement this feature?
      placeholder: |
        - I can contribute code
        - I can help with testing
        - I can provide feedback during development
        - I can help with documentation

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might be helpful
      placeholder: Links, references, related issues...