version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    reviewers:
      - "anubissbe"
    assignees:
      - "anubissbe"
    commit-message:
      prefix: "🐍"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
      - "security"

  # Node.js dependencies (if frontend exists)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    reviewers:
      - "anubissbe"
    assignees:
      - "anubissbe"
    commit-message:
      prefix: "📦"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
      - "frontend"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "08:00"
    open-pull-requests-limit: 3
    reviewers:
      - "anubissbe"
    assignees:
      - "anubissbe"
    commit-message:
      prefix: "🐳"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "08:00"
    open-pull-requests-limit: 3
    reviewers:
      - "anubissbe"
    assignees:
      - "anubissbe"
    commit-message:
      prefix: "🔧"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"