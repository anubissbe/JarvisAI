name: 🔒 Security & Code Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Run every Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # 🔍 CodeQL Analysis
  codeql:
    name: 🔍 CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
          upload-database: false

  # 🛡️ Dependency Scanning
  dependency-scan:
    name: 🛡️ Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🔍 Run Python security scan with bandit
        run: |
          pip install bandit[toml]
          if [ -d "backend" ]; then
            bandit -r backend/ -f json -o bandit-report.json || true
            bandit -r backend/ -ll || echo "No critical security issues found"
          else
            echo "Backend directory not found, creating empty report"
            echo '{"results": [], "metrics": {"_totals": {"CONFIDENCE.HIGH": 0, "SEVERITY.HIGH": 0}}}' > bandit-report.json
          fi

      - name: 🔍 Run Python dependency scan with safety
        run: |
          pip install safety
          if [ -f "backend/requirements.txt" ]; then
            pip install -r backend/requirements.txt
            pip freeze | safety check --json --output safety-report.json || true
            pip freeze | safety check || echo "No critical safety issues found"
          else
            echo "No requirements.txt found, creating empty safety report"
            echo '{"vulnerabilities": [], "scanned_packages": 0}' > safety-report.json
          fi

      - name: 🔍 Run Node.js security audit
        run: |
          cd frontend 2>/dev/null || echo "Frontend directory not found, skipping..."
          if [ -f package.json ]; then
            npm audit --audit-level moderate
          fi

      - name: 📊 Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # 🔐 Secret Scanning
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  # 🐳 Docker Security Scan
  docker-security:
    name: 🐳 Docker Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build backend image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: jarvis-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Run Trivy vulnerability scanner on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'jarvis-backend:scan'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'

      - name: 📊 Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'

  # 🔒 SAST with Semgrep
  semgrep:
    name: 🔒 SAST with Semgrep
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Semgrep
        run: |
          if [ -f ".github/semgrep.yml" ]; then
            semgrep --config=.github/semgrep.yml --sarif --output=semgrep.sarif ./
          else
            semgrep --config=auto --sarif --output=semgrep.sarif ./
          fi

      - name: 📊 Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

  # 🚨 Security Summary
  security-summary:
    name: 🚨 Security Summary
    runs-on: ubuntu-latest
    needs: [codeql, dependency-scan, secret-scan, docker-security, semgrep]
    if: always()
    steps:
      - name: 📋 Create security summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Security | ${{ needs.docker-security.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Semgrep) | ${{ needs.semgrep.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Check the **Security** tab for detailed findings." >> $GITHUB_STEP_SUMMARY