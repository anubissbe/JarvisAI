name: 📊 Code Quality & Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 🎨 Code Formatting & Style
  code-style:
    name: 🎨 Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📋 Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy

      - name: 🎨 Check Python code formatting
        run: |
          echo "## 🐍 Python Code Style Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Black formatting check
          if black --check backend/; then
            echo "✅ **Black formatting**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Black formatting**: Failed" >> $GITHUB_STEP_SUMMARY
            echo "Run \`black backend/\` to fix formatting issues." >> $GITHUB_STEP_SUMMARY
          fi
          
          # isort import sorting check
          if isort --check-only backend/; then
            echo "✅ **Import sorting**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Import sorting**: Failed" >> $GITHUB_STEP_SUMMARY
            echo "Run \`isort backend/\` to fix import sorting." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔍 Python linting with flake8
        run: |
          flake8 backend/ --max-line-length=88 --extend-ignore=E203,W503 \
            --format='%(path)s:%(row)d:%(col)d: %(code)s %(text)s' > flake8-report.txt || true
          
          if [ -s flake8-report.txt ]; then
            echo "❌ **Flake8 linting**: Issues found" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>View Issues</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat flake8-report.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Flake8 linting**: Passed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📋 Install frontend dependencies
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend
            npm ci
            echo "✅ Frontend dependencies installed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No frontend directory found, skipping..." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🎨 Check frontend code style
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 🎨 Frontend Code Style Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if npm run lint; then
              echo "✅ **ESLint**: Passed" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **ESLint**: Issues found" >> $GITHUB_STEP_SUMMARY
            fi
            
            if npm run prettier:check 2>/dev/null; then
              echo "✅ **Prettier**: Passed" >> $GITHUB_STEP_SUMMARY
            else
              echo "ℹ️ **Prettier**: Check not configured" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  # 📊 Code Complexity Analysis
  complexity-analysis:
    name: 📊 Code Complexity Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📋 Install analysis tools
        run: |
          pip install radon xenon

      - name: 📊 Analyze code complexity
        run: |
          echo "## 📊 Code Complexity Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Cyclomatic complexity
          echo "### Cyclomatic Complexity" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          radon cc backend/ -a -s >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Maintainability index
          echo "### Maintainability Index" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          radon mi backend/ -s >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # 🔍 SonarCloud Analysis
  sonarcloud:
    name: 🔍 SonarCloud Analysis
    runs-on: ubuntu-latest
    if: github.repository_owner == 'anubissbe'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: 🔍 SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=anubissbe_JarvisAI
            -Dsonar.organization=anubissbe
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.sources=backend/,frontend/
            -Dsonar.exclusions=**/*test*/**,**/__pycache__/**,**/node_modules/**

  # 📈 Performance Benchmarks
  performance:
    name: 📈 Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📋 Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest-benchmark

      - name: 🏃‍♂️ Run performance benchmarks
        run: |
          cd backend
          if [ -d "tests" ] && find tests -name "*bench*" -o -name "*performance*" | grep -q .; then
            pytest --benchmark-only --benchmark-json=benchmark.json || true
            echo "## 📈 Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Benchmark results saved to artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "## 📈 Performance Benchmarks" >> $GITHUB_STEP_SUMMARY
            echo "No benchmark tests found. Consider adding performance tests." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📊 Upload benchmark results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: benchmark-results
          path: backend/benchmark.json

  # 📋 Documentation Check
  docs-check:
    name: 📋 Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📚 Check documentation completeness
        run: |
          echo "## 📋 Documentation Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Check for essential documentation files
          files=("README.md" "CONTRIBUTING.md" "LICENSE" ".github/FUNDING.yml")
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "| $file | ✅ Present |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $file | ❌ Missing |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          # Check for API documentation
          if find . -name "*.md" -exec grep -l "API" {} \; | head -1 > /dev/null; then
            echo "| API Documentation | ✅ Present |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| API Documentation | ⚠️ Consider adding |" >> $GITHUB_STEP_SUMMARY
          fi

  # 📊 Code Quality Summary
  quality-summary:
    name: 📊 Quality Summary
    runs-on: ubuntu-latest
    needs: [code-style, complexity-analysis, docs-check]
    if: always()
    steps:
      - name: 📋 Create quality summary
        run: |
          echo "## 🏆 Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Style | ${{ needs.code-style.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Complexity Analysis | ${{ needs.complexity-analysis.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.docs-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Goal**: Maintain high code quality and comprehensive documentation." >> $GITHUB_STEP_SUMMARY